<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b0b0f">
  <title>Nozomi AI</title>
  <style>
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:#0b0b0f;
      color:#fff;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      display:flex;
      flex-direction:column;
    }
    header{
      padding:16px 18px;
      border-bottom:1px solid #27272f;
      background:#111118;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{
      font-size:20px;
      font-weight:800;
      letter-spacing:.4px;
    }
    .model-wrap{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:12px;
      opacity:.95;
    }
    select{
      background:#1b1b23;
      color:#fff;
      border:1px solid #34343f;
      border-radius:10px;
      padding:8px 10px;
      outline:none;
      max-width:190px;
    }
    #chat{
      flex:1;
      overflow-y:auto;
      padding:18px;
      scroll-behavior:smooth;
    }
    .msg{
      max-width:86%;
      padding:12px 14px;
      margin:10px 0;
      border-radius:16px;
      line-height:1.45;
      white-space:pre-wrap;
      word-break:break-word;
    }
    .ai{background:#1c1c25;margin-right:auto}
    .user{background:#2563eb;margin-left:auto}
    .muted{opacity:.65;font-style:italic}
    form{
      display:flex;
      gap:8px;
      padding:12px;
      border-top:1px solid #27272f;
      background:#111118;
    }
    input{
      flex:1;
      min-width:0;
      border:1px solid #33333f;
      border-radius:14px;
      background:#1b1b23;
      color:#fff;
      padding:14px;
      font-size:16px;
      outline:none;
    }
    button{
      border:0;
      border-radius:14px;
      padding:0 18px;
      font-weight:800;
      background:#fff;
      color:#0b0b0f;
      cursor:pointer;
    }
    button:disabled{opacity:.5;cursor:default}
    @media(max-width:620px){
      header{align-items:flex-start;flex-direction:column}
      .model-wrap{width:100%}
      select{flex:1;max-width:none}
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">NOZOMI AI</div>
    <div class="model-wrap">
      <span>Model</span>
      <select id="model">
        <option value="deepseek-v4.1-flash:free">DeepSeek V4.1 Flash</option>
        <option value="deepseek-v4-flash:free">DeepSeek V4 Flash</option>
        <option value="mimo-v2.5:free">MiMo V2.5</option>
      </select>
    </div>
  </header>

  <main id="chat">
    <div class="msg ai">Selamat datang master 😁</div>
  </main>

  <form id="form">
    <input id="input" placeholder="Tulis pesan..." autocomplete="off">
    <button id="send" type="submit">Kirim</button>
  </form>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");
    const send = document.getElementById("send");
    const model = document.getElementById("model");

    const savedModel = localStorage.getItem("nozomi_model");
    if (savedModel) model.value = savedModel;

    model.addEventListener("change", () => {
      localStorage.setItem("nozomi_model", model.value);
      addMessage("Model diganti ke " + model.options[model.selectedIndex].text + ".", "ai");
    });

    function addMessage(text, cls) {
      const el = document.createElement("div");
      el.className = "msg " + cls;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      input.focus();
      send.disabled = true;

      const loading = addMessage("Nozomi sedang berpikir...", "ai muted");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({
            message,
            model: model.value
          })
        });

        const data = await response.json().catch(() => ({}));

        loading.className = "msg ai";

        if (!response.ok) {
          loading.textContent = "Error: " + (data.error || ("HTTP " + response.status));
        } else {
          loading.textContent = data.reply || "Tidak ada jawaban dari model.";
        }
      } catch (error) {
        loading.className = "msg ai";
        loading.textContent = "Gagal terhubung ke server.";
      } finally {
        send.disabled = false;
      }
    });
  </script>
</body>
</html>
