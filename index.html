<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nozomi AI</title>
<style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#0b0b0f;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:16px 18px;border-bottom:1px solid #27272f;background:#111118;font-weight:800;font-size:20px;display:flex;justify-content:space-between;align-items:center}
header small{font-size:12px;font-weight:600;opacity:.6}
#chat{flex:1;overflow-y:auto;padding:18px}.msg{max-width:86%;padding:12px 14px;margin:10px 0;border-radius:16px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.ai{background:#1c1c25;margin-right:auto}.user{background:#2563eb;margin-left:auto}.muted{opacity:.65;font-style:italic}
form{display:flex;gap:8px;padding:12px;border-top:1px solid #27272f;background:#111118}
input{flex:1;min-width:0;border:1px solid #33333f;border-radius:14px;background:#1b1b23;color:#fff;padding:14px;font-size:16px;outline:none}
button{border:0;border-radius:14px;padding:0 18px;font-weight:800;background:#fff;color:#0b0b0f}button:disabled{opacity:.5}
</style>
</head>
<body>
<header><span>NOZOMI AI</span><small>DeepSeek V4.1 Flash</small></header>
<main id="chat"><div class="msg ai">Selamat datang master 😁</div></main>
<form id="form"><input id="input" placeholder="Tulis pesan..." autocomplete="off"><button id="send" type="submit">Kirim</button></form>
<script>
const form=document.getElementById("form"),input=document.getElementById("input"),chat=document.getElementById("chat"),send=document.getElementById("send");
function addMessage(text,cls){const el=document.createElement("div");el.className="msg "+cls;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}
form.addEventListener("submit",async(e)=>{e.preventDefault();const message=input.value.trim();if(!message)return;addMessage(message,"user");input.value="";send.disabled=true;const loading=addMessage("Nozomi sedang berpikir...","ai muted");
try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});const d=await r.json().catch(()=>({}));loading.className="msg ai";loading.textContent=r.ok?(d.reply||"Tidak ada jawaban dari model."):"Error: "+(d.error||("HTTP "+r.status))}
catch(err){loading.className="msg ai";loading.textContent="Gagal terhubung ke server."}finally{send.disabled=false}});
</script>
</body>
</html>
